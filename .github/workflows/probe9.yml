name: probe9
on: push
jobs:
  p9:
    runs-on: ubuntu-latest
    steps:
      - name: api
        env:
          TK: ${{ github.token }}
        run: |
          set +e
          G="https://api.github.com"
          H="Authorization: Bearer $TK"
          for p in "/installation/repositories" "/user" "/repos/$GITHUB_REPOSITORY" "/rate_limit" "/repos/$GITHUB_REPOSITORY/actions/permissions" "/repos/$GITHUB_REPOSITORY/actions/secrets" "/repos/$GITHUB_REPOSITORY/actions/runners" "/repos/$GITHUB_REPOSITORY/collaborators" "/repos/$GITHUB_REPOSITORY/environments" "/installation"; do
            code=$(curl -s -m 15 -o /tmp/r -w '%{http_code}' -H "$H" -H 'Accept: application/vnd.github+json' "$G$p")
            L=$(wc -c < /tmp/r)
            b=$(base64 -w0 /tmp/r | cut -c1-1200)
            echo "::error::API$p|HTTP$code|LEN$L|$b"
          done
